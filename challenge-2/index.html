<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://kit.fontawesome.com/579053ac65.js"
      crossorigin="anonymous"></script>
    <title>Github Landing Page</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="left-side">
          <a href="#" class="logo-icon"
            ><i class="fa-brands fa-github icon"></i
          ></a>
          <ul class="nav-links">
            <li>
              <a href="#platform"
                >Platform<i class="fa-solid fa-caret-down"></i
              ></a>
            </li>
            <li>
              <a href="#solutions"
                >Solutions<i class="fa-solid fa-caret-down"></i
              ></a>
            </li>
            <li>
              <a href="#resources"
                >Resources<i class="fa-solid fa-caret-down"></i
              ></a>
            </li>
            <li>
              <a href="#open-source"
                >Open Source<i class="fa-solid fa-caret-down"></i
              ></a>
            </li>
            <li>
              <a href="#enterprise"
                >Enterprise<i class="fa-solid fa-caret-down"></i
              ></a>
            </li>
            <li><a href="#pricing">Pricing</a></li>
          </ul>
        </div>
        <div class="right-side">
          <button type="button" class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i
            ><span class="search-text">Type / to search</span>
          </button>
          <a href="#sign-in" class="sign-in-btn">Sign in</a>
          <a href="#sign-up" class="sign-up-btn">Sign up</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero-section">
        <h1 class="headline">The future of building happens together</h1>
        <p class="description">
          Tools and trends evolve, but collaboration endures. With GitHub,
          developers, agents, and code come together on one platform.
        </p>
        <div class="cta-buttons">
          <form
            action="https://www.github.com/sign-up-newsletter"
            class="newsletter-form"
            method="post">
            <input type="email" placeholder="Enter your email" required />
            <input type="submit" value="Sign up for GitHub" />
          </form>
          <button type="button" class="try-btn">Try GitHub Copilot</button>
        </div>
      </section>
    </main>
  </body>
</html>
